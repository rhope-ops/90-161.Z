name: security
# Static security scans: bandit on scripts/ (in package mode after --kit-install writes the kit scripts) and gitleaks on the working tree.
# Pull requests and manual runs only, never on push (Actions minutes). A private repo skips the pull-request run, as check.yml does: the content
# check covers secrets on each push, and bandit runs only on a manual run there.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bandit:
    name: bandit
    if: github.event_name != 'pull_request' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit==1.9.4
      - name: Kit package (package mode only; else it prints "not used"), so bandit also scans the package scripts
        run: scripts/check.sh --kit-install
      - name: Scan scripts (medium severity and higher)
        run: bandit -r scripts/ -ll
  gitleaks:
    name: gitleaks
    if: github.event_name != 'pull_request' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download gitleaks and verify its checksum
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP/gitleaks" && grep " $tarball\$" checksums.txt | sha256sum --check --strict -)
          tar -xzf "$RUNNER_TEMP/gitleaks/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" detect --no-git --source . --redact'
