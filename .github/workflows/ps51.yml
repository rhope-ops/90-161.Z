name: ps51
# The repo's PowerShell tests on Windows PowerShell 5.1 (powershell.exe), the floor on the work computers (standards plan, Stage 6).
# Runs the tests of tests/ps that work on Windows through tests/ps/Invoke-Ps51.ps1 (its help lists the tests left out and why).
# Pull requests that change PowerShell code or its tests, and manual runs; never on push (AGENTS.md "Checks").
# It does not replace a work-computer round: Word, PnP and the tenant are not on the runner. No secret, read-only token.
on:
  pull_request:
    paths:
      - "scripts/gov/**"
      - "tests/ps/**"
      - "tests/fake-pnp/**"
      - ".github/workflows/ps51.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep line ends as they are in the repository
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - name: Run the tests on Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host ('PowerShell ' + $PSVersionTable.PSVersion)
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Host 'This job must run Windows PowerShell 5.1'; exit 1 }
          & powershell.exe -NoProfile -File tests/ps/Invoke-Ps51.ps1
          exit $LASTEXITCODE
