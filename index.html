<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>90-161.Z tasks</title>
<style>
/* Layout: a navy-to-blue RADE band (logo K, title, open count) over one column of task cards; open tasks first, Done last.
   Colors: Wing Master Version II (navy 0B2545, Air Force blue 00539F, AF yellow FFD520 as trim only), as the RADE window. */
:root{--bg:#f4f6f9;--fg:#16202e;--mut:#526173;--card:#ffffff;--line:#d3dae3;--acc:#00539f;--acc-fg:#ffffff;--navy:#0b2545;--blue:#00539f;--gold:#ffd520;--mist:#dde8f3;
--open-bg:#dde8f3;--open-fg:#0b2545;--done-bg:#d6ebdd;--done-fg:#1d5534;--note-bg:#fff6d6;--note-fg:#5a4300;--focus:#00539f;--ctl:#8a97a8;--code:#eef1f5;
--ui:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--mono:Consolas,"Cascadia Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--fg:#e6ebf1;--mut:#a5b1c0;--card:#172130;--line:#2b394b;--acc:#8db4ec;--acc-fg:#0b2545;--open-bg:#1c3a5e;--open-fg:#dde8f3;--done-bg:#173a26;--done-fg:#bfe6cc;--note-bg:#3a300c;--note-fg:#ffe48a;--focus:#8db4ec;--ctl:#5d6b7d;--code:#1f2b3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141c;--fg:#e6ebf1;--mut:#a5b1c0;--card:#172130;--line:#2b394b;--acc:#8db4ec;--acc-fg:#0b2545;--open-bg:#1c3a5e;--open-fg:#dde8f3;--done-bg:#173a26;--done-fg:#bfe6cc;--note-bg:#3a300c;--note-fg:#ffe48a;--focus:#8db4ec;--ctl:#5d6b7d;--code:#1f2b3b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--ui)}
.band{background:linear-gradient(100deg,var(--navy),var(--blue));color:#fff;border-bottom:3px solid var(--gold)}
.band-in,main{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{display:flex;align-items:center;gap:14px;padding-block:18px}
.logo{flex:none;width:48px;height:48px}
.band h1{font-size:1.375rem;line-height:1.2;margin:0;text-wrap:balance;font-weight:650}
.band .sub{color:var(--mist);font-size:.875rem;margin:2px 0 0}
.band .count{margin-left:auto;text-align:right;color:var(--mist);font-size:.8125rem;font-variant-numeric:tabular-nums}
.band .count b{display:block;color:#fff;font-size:1.5rem;line-height:1.1}
main{padding-block:20px 48px}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mut{color:var(--mut);font-size:.875rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
button{font:inherit;font-size:.875rem;min-height:36px;padding:6px 14px;border:1px solid var(--ctl);border-radius:4px;background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
button.primary:hover{background:var(--navy);border-color:var(--navy)}
button:disabled{cursor:default;opacity:.85}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.toc li{margin:0}
.toc a{display:inline-flex;align-items:center;min-height:32px;padding:2px 12px;border-radius:4px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:.8125rem}
.toc a.is-open{border-color:var(--acc);color:var(--acc);font-weight:600}
details.sec{border:1px solid var(--line);border-radius:6px;margin:0 0 12px;background:var(--card)}
details.sec.open-task{border-left:4px solid var(--blue)}
details.sec.done-task>summary .st{color:var(--mut)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1em 1fr auto;column-gap:10px;row-gap:4px;align-items:baseline;min-height:44px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"\25B8";color:var(--mut)}
details.sec[open]>summary::before{content:"\25BE"}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:flex-end}
.st{font-weight:600;font-size:1.0625rem;min-width:0;text-wrap:balance}
.chip{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap}
.chip.open{background:var(--open-bg);color:var(--open-fg)}
.chip.done{background:var(--done-bg);color:var(--done-fg)}
.when{font-size:.8125rem;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.body{padding:6px 18px 14px 42px;min-width:0}
@media (max-width:560px){details.sec>summary{grid-template-columns:1em 1fr}.meta{grid-column:2;justify-content:flex-start}.body{padding:6px 14px 14px 16px}.band .count{display:none}}
.body p{margin:8px 0;max-width:72ch}
.body strong{color:var(--fg)}
h3{font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 4px}
ol,ul{margin:8px 0;padding-left:24px}
li{margin:6px 0;max-width:72ch}
code{font:.875em/1.4 var(--mono);background:var(--code);padding:1px 4px;border-radius:3px}
.lbl{font-weight:600}
.folder{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--code);border:1px solid var(--line);border-radius:4px;padding:8px 12px;margin:8px 0}
.folder code{background:none;padding:0;word-break:break-all;flex:1 1 240px}
.note{background:var(--note-bg);color:var(--note-fg);border-radius:4px;padding:8px 12px;margin:8px 0}
.file{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 12px;margin:8px 0;background:var(--bg)}
.file .fn{flex:1 1 240px;min-width:0}
.file .fn a{font-weight:600;word-break:break-all}
.file .fu{display:block;font-size:.75rem;color:var(--mut);word-break:break-all}
.file button{min-height:36px}
.done-list li{color:var(--fg)}
.foot{margin-top:24px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
@media print{details.sec>.body{display:block}.bar,.toc,button{display:none}.band{background:none;color:#000;border-bottom:1px solid #000}}
</style></head><body><header class="band"><div class="band-in"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="48" height="48" class="logo" aria-hidden="true" focusable="false" aria-label="Logo: Greek letter rho inside a square frame and a square turned 45 degrees, woven, in a blue ring with a thin yellow edge">
  
  <defs>
    <mask id="cut-diamond" maskUnits="userSpaceOnUse" x="-64" y="-64" width="128" height="128"><rect x="-64" y="-64" width="128" height="128" fill="#fff"/><g stroke="#000" stroke-width="11.2"><line x1="-1.76" y1="-29.00" x2="21.76" y2="-29.00"/><line x1="29.00" y1="-1.76" x2="29.00" y2="21.76"/><line x1="1.76" y1="29.00" x2="-21.76" y2="29.00"/><line x1="-29.00" y1="1.76" x2="-29.00" y2="-21.76"/></g></mask>
    <mask id="cut-frame" maskUnits="userSpaceOnUse" x="-64" y="-64" width="128" height="128"><rect x="-64" y="-64" width="128" height="128" fill="#fff"/><g stroke="#000" stroke-width="11.2"><line x1="-1.69" y1="-37.31" x2="-18.31" y2="-20.69"/><line x1="37.31" y1="-1.69" x2="20.69" y2="-18.31"/><line x1="1.69" y1="37.31" x2="18.31" y2="20.69"/><line x1="-37.31" y1="1.69" x2="-20.69" y2="18.31"/></g></mask>
  </defs>
  <circle r="58" fill="#FFFFFF"/>
  <circle r="62.4" fill="none" stroke="#FFCD00" stroke-width="2.8"/>
  <circle r="58" fill="none" stroke="#00308F" stroke-width="6"/>
  <path d="M0 -39.0L39.0 0L0 39.0L-39.0 0Z" fill="none" stroke="#00308F" stroke-width="8.0" mask="url(#cut-diamond)"/>
  <path d="M-29.0 -29.0H29.0V29.0H-29.0Z" fill="none" stroke="#00308F" stroke-width="8.0" mask="url(#cut-frame)"/>
  <path d="M272 461Q371 461 429.0 397.0Q487 333 487 233Q487 129 427.5 59.5Q368 -10 266 -10Q197 -10 143 33Q143 12 144.0 -29.0Q145 -70 145 -90Q145 -174 134 -221H50Q51 -212 54.5 -195.0Q58 -178 60.0 -164.0Q62 -150 62 -137Q62 -83 59.5 24.5Q57 132 57 186Q57 239 69.0 286.5Q81 334 105.5 374.0Q130 414 173.0 437.5Q216 461 272 461ZM262 432Q138 432 138 239Q138 205 146.0 168.5Q154 132 170.0 97.5Q186 63 215.0 41.0Q244 19 281 19Q314 19 337.5 35.5Q361 52 373.0 80.0Q385 108 390.0 136.5Q395 165 395 196Q395 232 389.0 268.5Q383 305 369.5 344.0Q356 383 328.0 407.5Q300 432 262 432Z" fill="#00308F" transform="translate(-10.74 6.30) scale(0.04 -0.04)"/>
</svg><div><h1 id="ht">90-161.Z tasks</h1><p class="sub">RADE rounds and by-hand steps, newest first</p></div><div class="count" id="hc" aria-live="polite"></div></div></header><main id="m"><p class="mut">Loading…</p></main>
<script>
(function(){
var SRC='https://raw.githubusercontent.com/rhope-ops/90-161.Z/main/go.md';
var KEY='go-open-v1';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inl(s){
  // escape, then links, **bold**, `code`
  var o=esc(s).replace(/(https?:\/\/[^\s<]+|(?:raw\.githubusercontent\.com|rhope-ops\.github\.io)\/[^\s<]*)/g,function(u){var h=u.indexOf('http')===0?u:'https://'+u;return '<a href="'+h+'">'+u+'</a>'});
  o=o.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  return o;
}
function slug(s,i){return 's'+i+'-'+s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function copy(t,b){
  var ok=function(){var x=b.textContent;b.textContent='Copied';setTimeout(function(){b.textContent=x},1200)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fallback(t);ok()})}else{fallback(t);ok()}
}
function fallback(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a)}
var SCRIPTS={}; // round scripts, loaded ahead so one click copies the whole text (PFM 13 Nov)
function isRound(h){return /\/scripts\/gov\/paste\/[^\/]+\.ps1$/.test(h)}
function fileCard(u){
  var h=u.indexOf('http')===0?u:'https://'+u, name=h.split('/').pop();
  return '<div class="file"><span class="fn"><a href="'+esc(h)+'">'+esc(name)+'</a><span class="fu">'+esc(h)+'</span></span>'+
    (isRound(h)?'<button type="button" class="primary" data-script="'+esc(h)+'" aria-label="Copy the whole script '+esc(name)+'">Copy script</button>':'')+
    '<button type="button" data-copy="'+esc(h)+'" aria-label="Copy link to '+esc(name)+'">Copy link</button></div>';
}
function blocked(b){b.textContent='Copy blocked: open the link, Ctrl+A, Ctrl+C';b.disabled=true}
function copyScript(b){
  var h=b.getAttribute('data-script'),t=SCRIPTS[h];
  if(typeof t!=='string'){if(b.getAttribute('data-state')==='loading'){b.textContent='Still loading; press again in a moment'}else{blocked(b)}return}
  var ok=function(){b.textContent='Copied ('+t.split('\n').length.toLocaleString()+' lines). Now paste in ISE.';setTimeout(function(){b.textContent='Copy script'},4000)};
  var viaArea=function(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(a);return r};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){viaArea()?ok():blocked(b)})}else{viaArea()?ok():blocked(b)}
}
function preload(m){
  Array.prototype.forEach.call(m.querySelectorAll('button[data-script]'),function(b){
    var h=b.getAttribute('data-script');b.textContent='Copy script (loading)';b.setAttribute('data-state','loading');
    fetch(h,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){SCRIPTS[h]=t;b.removeAttribute('data-state');b.disabled=false;b.textContent='Copy script'}).catch(function(){b.removeAttribute('data-state');blocked(b)});
  });
}
function folderBox(lbl,path){
  return '<div class="folder"><span class="lbl">'+esc(lbl)+'</span><code>'+esc(path)+'</code>'+
    '<button type="button" data-copy="'+esc(path)+'" aria-label="Copy folder path">Copy</button></div>';
}
function renderBody(lines){
  var o='',list=null,item=false;
  function closeItem(){if(item){o+='</li>';item=false}}
  function closeList(){closeItem();if(list){o+='</'+list+'>';list=null}}
  lines.forEach(function(l){
    var t=l.trim(),m;
    if(!t){return}
    if(/^(https?:\/\/|raw\.githubusercontent\.com\/)\S+$/.test(t)){ // bare URL line: file card, kept inside the open step
      o+=fileCard(t);return;
    }
    if((m=t.match(/^(\d+)\.\s+(.*)$/))){
      if(list!=='ol'){closeList();o+='<ol>';list='ol'}
      closeItem();o+='<li value="'+m[1]+'">'+inl(m[2]);item=true;return;
    }
    if((m=t.match(/^[-*]\s+(.*)$/))){
      if(list!=='ul'){closeList();o+='<ul class="done-list">';list='ul'}
      closeItem();o+='<li>'+inl(m[1]);item=true;return;
    }
    closeList();
    if((m=t.match(/^(Folder|Bookmark[^:]*|Fallback[^:]*):\s*(.*)$/))&&/[\\\/]/.test(m[2])){
      var path=m[2].replace(/\.\s.*$/,''),rest=m[2].slice(path.length).replace(/^\.\s*/,'');
      o+=folderBox(m[1]+':',path)+(rest?'<p>'+inl(rest)+'</p>':'');return;
    }
    if((m=t.match(/^(Report|Status[^:]*|Decided|FAIL|WARN):\s*(.*)$/))){o+='<p class="note"><span class="lbl">'+esc(m[1])+':</span> '+inl(m[2])+'</p>';return}
    if(/^[A-Z][^.]{2,80}:$/.test(t)||/^Part [A-Z]\b.*:$/.test(t)){o+='<h3>'+inl(t.slice(0,-1))+'</h3>';return}
    o+='<p>'+inl(t)+'</p>';
  });
  closeList();
  return o;
}
function render(md){
  var lines=md.replace(/\r/g,'').split('\n'),title='',intro=[],secs=[],cur=null;
  lines.forEach(function(l){
    if(/^# /.test(l)&&!title){title=l.slice(2);return}
    if(/^## /.test(l)){cur={h:l.slice(3),lines:[]};secs.push(cur);return}
    (cur?cur.lines:intro).push(l);
  });
  var st=load(),o='',nav='',body='';document.getElementById('ht').innerHTML=inl(title.replace(/^90-161\.Z:\s*/,'90-161.Z · '));
  var openCount=0;
  secs.forEach(function(s,i){
    var m=s.h.match(/^(.*?)\s*\((open|done)[,\s]*([^)]*)\)\s*$/i),name=m?m[1]:s.h,state=m?m[2].toLowerCase():(/^done$/i.test(s.h)?'done':''),when=m?m[3]:'';
    var id=slug(name,i),isOpen;
    if(state==='open')openCount++;
    if(Object.prototype.hasOwnProperty.call(st,name))isOpen=st[name];else isOpen=(state==='open');
    nav+='<li><a href="#'+id+'"'+(state==='open'?' class="is-open"':'')+'>'+inl(name)+'</a></li>';
    body+='<details class="sec'+(state==='open'?' open-task':state==='done'?' done-task':'')+'" id="'+id+'" data-name="'+esc(name)+'"'+(isOpen?' open':'')+'><summary><span class="st">'+inl(name)+'</span><span class="meta">'+
      (state?'<span class="chip '+state+'">'+(state==='open'?'Open':'Done')+'</span>':'')+(when?'<span class="when">'+esc(when)+'</span>':'')+
      (/^done$/i.test(s.h)?'<span class="when">'+s.lines.filter(function(x){return /^\s*-\s/.test(x)}).length+' items</span>':'')+
      '</span></summary><div class="body">'+renderBody(s.lines)+'</div></details>';
  });
  var how=(Object.prototype.hasOwnProperty.call(st,'__how')?st.__how:false);
  document.getElementById('hc').innerHTML='<b>'+openCount+'</b>open task'+(openCount===1?'':'s');
  o+='<p class="mut">Loaded '+new Date().toLocaleString()+'. GitHub can serve a copy up to 5 minutes old: press Reload for the newest.</p>';
  o+='<div class="bar"><button type="button" id="ex">Expand all</button><button type="button" id="co">Collapse all</button><button type="button" id="rl">Reload</button></div>';
  o+='<nav aria-label="Sections"><ul class="toc">'+nav+'</ul></nav>';
  o+='<details class="sec" data-name="__how"'+(how?' open':'')+'><summary><span class="st">How to use this page</span></summary><div class="body">'+renderBody(intro)+'</div></details>';
  o+=body+'<p class="mut foot">Source: <a href="'+SRC+'">go.md</a> in rhope-ops/90-161.Z. Open and closed sections are remembered in this browser.</p>';
  var m=document.getElementById('m');m.innerHTML=o;
  m.addEventListener('click',function(e){var s=e.target.closest&&e.target.closest('button[data-script]');if(s){e.preventDefault();copyScript(s);return}var b=e.target.closest&&e.target.closest('button[data-copy]');if(b){e.preventDefault();copy(b.getAttribute('data-copy'),b)}});
  preload(m);
  var all=function(){return Array.prototype.slice.call(m.querySelectorAll('details.sec'))};
  all().forEach(function(d){d.addEventListener('toggle',function(){var s=load();s[d.getAttribute('data-name')]=d.open;save(s)})});
  document.getElementById('ex').onclick=function(){all().forEach(function(d){d.open=true})};
  document.getElementById('co').onclick=function(){all().forEach(function(d){d.open=false})};
  document.getElementById('rl').onclick=function(){location.reload()};
  m.querySelectorAll('.toc a').forEach(function(a){a.addEventListener('click',function(){var d=document.getElementById(a.getAttribute('href').slice(1));if(d)d.open=true})});
  if(location.hash){var d=document.getElementById(location.hash.slice(1));if(d){d.open=true;d.scrollIntoView()}}
  window.addEventListener('beforeprint',function(){all().forEach(function(d){d.open=true})});
}
if(typeof window.GO_MD==='string'){render(window.GO_MD);return}
fetch(SRC,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(render).catch(function(e){
  document.getElementById('m').innerHTML='<p>Could not load go.md ('+esc(e.message)+'). Fallback: <a href="'+SRC+'">'+SRC+'</a></p>'});
})();
</script></body></html>
