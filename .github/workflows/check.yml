name: checks
# Repo checks and the content check (personal data, secrets, the Maintainer's terms, blocked files) in one job (one runner start).
# The full lane of scripts/check.sh. Pull requests and manual runs only, never on push (.claude/skills/deliver/SKILL.md: Actions minutes).
# A private repo skips the pull-request run (Actions minutes; its merge gate is the local full lane, AGENTS.md "Checks"); a manual run still works.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    # Shown on GitHub as "checks" (without a name, GitHub shows the job id "scan"). A repo that made "scan" a
    # required status check must change it to "checks" (Settings > Branches), or its pull requests wait for ever.
    name: checks
    if: github.event_name != 'pull_request' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Repo checks (self-tests, project log in the full tier, project tests)
        run: scripts/check.sh
      - name: Content check of files and commits
        env:
          # Word lists, one entry per line. Set them in Settings > Secrets and variables > Actions.
          PII_GUARD_DENYLIST: ${{ secrets.PII_GUARD_DENYLIST }}  # names (personal data); needed
          CHECK_TERMS: ${{ secrets.CHECK_TERMS }}                # the Maintainer's own blocked terms; optional
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The settings file (.check) comes from the PR base, so a PR cannot switch the check off or widen its allow list.
          # The scripts run from the PR head: a PR that edits scripts/check_content*.py or scripts/check.sh needs a review by hand.
          ref="${BASE_SHA:-HEAD}"
          if ! git cat-file -e "$ref:.check" 2>/dev/null && ! git cat-file -e "$ref:.pii-guard" 2>/dev/null; then echo "no .check file on $ref: content check not enabled"; exit 0; fi
          # No secret (not added, or a fork or Dependabot PR) = the check fails: names must be checked (kit default, 2026-11-11), unless the base .check has "denylist: warn" (starter tier): then check_content.py only warns.
          # A private repo never gets here on a pull request (the job's "if"; the Maintainer, 2026-11-18): its gate is the
          # local full lane and the pre-push hook. A manual run scans everything.
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check_content.py --require-denylist --all --range "$BASE_SHA..HEAD" --allow-from "$BASE_SHA"
          else
            python3 scripts/check_content.py --require-denylist --all
          fi
