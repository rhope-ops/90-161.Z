name: pii-guard
# Repo checks and the personal-data scan in one job (one runner start).
# The full lane of scripts/check.sh. Pull requests and manual runs only, never on push (.claude/skills/deliver/SKILL.md: Actions minutes).
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test packages (the versions in docs/dev-setup.md step 4)
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          python3 -m pip install --quiet --user python-docx==1.2.0 pillow==12.3.0
          npm install --global --silent docx@9.7.1
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"
      - name: Repo checks (self-tests, project log in the full tier, project tests)
        run: scripts/check.sh
      - name: Scan files and commits
        env:
          # Name denylist, one name per line. Set it in Settings > Secrets and variables > Actions.
          PII_GUARD_DENYLIST: ${{ secrets.PII_GUARD_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # Opt-in and allow list come from the PR base, so a PR cannot switch the guard off or widen its allow list.
          # The scripts run from the PR head: a PR that edits scripts/pii_guard*.py or scripts/check.sh needs a review by hand.
          ref="${BASE_SHA:-HEAD}"
          if ! git cat-file -e "$ref:.pii-guard" 2>/dev/null; then echo "no .pii-guard file on $ref: guard not enabled"; exit 0; fi
          # No secret (not added, or a fork or Dependabot PR) = the check fails: names must be checked (kit default, 2026-11-11), unless the base .pii-guard has "denylist: warn" (starter tier): then pii_guard.py only warns.
          # Private repo (the PFM, 2026-11-17): the pull request's commits only. The pre-push hook already scanned every
          # tracked file, Actions minutes are limited, and GitHub Free gives a private repo no required check; this scan
          # catches what skipped the hook (a web-UI edit, a clone without core.hooksPath). A manual run scans everything.
          if [ -n "$BASE_SHA" ] && [ "$PRIVATE" = "true" ]; then
            python3 scripts/pii_guard.py --require-denylist --range "$BASE_SHA..HEAD" --allow-from "$BASE_SHA"
          elif [ -n "$BASE_SHA" ]; then
            python3 scripts/pii_guard.py --require-denylist --all --range "$BASE_SHA..HEAD" --allow-from "$BASE_SHA"
          else
            python3 scripts/pii_guard.py --require-denylist --all
          fi
